<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Delete Student</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f4f6;
            padding: 50px;
        }

        .container {
            max-width: 500px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            color: #dc2626;
            margin-bottom: 15px;
        }

        p {
            color: #6b7280;
            margin-bottom: 25px;
        }

        .student {
            background: #f9fafb;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .student p {
            margin-bottom: 8px;
            color: #111827;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #b91c1c;
        }

        .back {
            display: block;
            margin-top: 15px;
            text-decoration: none;
            color: #2563eb;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>Delete Student</h1>

        <p>
            Are you sure you want to delete this student?
        </p>


        <div class="student">

            <p>
                <strong>ID:</strong>
                {{ student.id }}
            </p>

            <p>
                <strong>Name:</strong>
                {{ student.name }}
            </p>

            <p>
                <strong>Email:</strong>
                {{ student.email }}
            </p>

            <p>
                <strong>Course:</strong>
                {{ student.course }}
            </p>

        </div>


        <form method="POST">

            {% csrf_token %}

            <button type="submit">
                Delete Student
            </button>

        </form>


        <a
            href="/students/{{ student.id }}/"
            class="back"
        >
            Cancel
        </a>

    </div>

</div>

</body>

</html>
