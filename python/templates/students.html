<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>All Students</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f4f6;
            padding: 40px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #111827;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #111827;
            color: white;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f9fafb;
        }

        .course {
            background: #dbeafe;
            color: #1d4ed8;
            padding: 6px 10px;
            border-radius: 20px;
        }

        .btn {
            display: inline-block;
            padding: 10px 15px;
            border-radius: 6px;
            text-decoration: none;
            color: white;
            margin-bottom: 20px;
        }

        .create {
            background: #16a34a;
        }

        .view {
            background: #2563eb;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>All Students</h1>

    <div class="card">

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
            <a href="/students/create/" class="btn create" style="margin-bottom: 0;">
                + Create Student
            </a>

            <form method="GET" action="/students/" style="display: flex; gap: 10px; align-items: center;">
                <input 
                    type="text" 
                    name="search" 
                    placeholder="Search name, email, course..." 
                    value="{{ search_query|default:'' }}" 
                    style="padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; width: 260px; outline: none;"
                >
                <button type="submit" class="btn view" style="margin-bottom: 0; cursor: pointer; border: none;">Search</button>
                {% if search_query %}
                    <a href="/students/" class="btn" style="background: #6b7280; margin-bottom: 0;">Clear</a>
                {% endif %}
            </form>
        </div>

        <table>

            <thead>

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Age</th>
                <th>Course</th>
                <th>Action</th>
            </tr>

            </thead>

            <tbody>

            {% for student in students %}

            <tr>

                <td>{{ student.id }}</td>

                <td>{{ student.name }}</td>

                <td>{{ student.email }}</td>

                <td>{{ student.age }}</td>

                <td>
                    <span class="course">
                        {{ student.course }}
                    </span>
                </td>

                <td>

                    <a
                        href="/students/{{ student.id }}/"
                        class="btn view"
                    >
                        View
                    </a>

                </td>

            </tr>

            {% empty %}

            <tr>

                <td colspan="6" style="text-align:center;">
                    No students found
                </td>

            </tr>

            {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
