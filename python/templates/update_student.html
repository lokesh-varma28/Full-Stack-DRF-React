<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Update Student</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f4f6;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #f59e0b;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #2563eb;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Update Student</h1>

    <div class="card">

        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label>Name</label>

                <input
                    type="text"
                    name="name"
                    value="{{ student.name }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    value="{{ student.email }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>Age</label>

                <input
                    type="number"
                    name="age"
                    value="{{ student.age }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>Course</label>

                <input
                    type="text"
                    name="course"
                    value="{{ student.course }}"
                    required
                >

            </div>


            <button type="submit">
                Update Student
            </button>

        </form>


        <a
            href="/students/{{ student.id }}/"
            class="back"
        >
            ← Back to Student
        </a>

    </div>

</div>

</body>

</html>
